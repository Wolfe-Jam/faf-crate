name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # rustfmt's cargo wrapper rejects --locked; it does not resolve dependencies.
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  # radio pulls faf-radio-rust -> tokio-tungstenite -> native-tls -> openssl,
  # which the default-feature job never compiles.
  test-all-features:
    name: test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo clippy --locked --all-features -- -D warnings
      # nextest writes a JUnit report (.config/nextest.toml) for the receipt.
      - name: Run tests
        run: cargo nextest run --locked --all-features --profile ci --no-fail-fast
      # nextest doesn't run doctests; the crate docs' example is compiled here.
      - run: cargo test --locked --all-features --doc
      - name: Upload the test output
        # main only, and after a red run too: the receipt job records it.
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: taf-test-output
          path: target/nextest/ci/junit.xml
      - run: cargo build --locked --all-features --release

  # TAF receipt: one per push to main, red runs included (FAILED), saved to the
  # taf-receipts branch by faf-taf-git's receipt job, the only job that writes.
  receipt:
    needs: test-all-features
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: Wolfe-Jam/faf-taf-git/.github/workflows/receipt.yml@v2.7.0
    with:
      artifact-name: taf-test-output
      test-output-file: junit.xml
      test-result: ${{ needs.test-all-features.result }}

  # rust-version in Cargo.toml is the promise; this job keeps it. It reads the
  # version from Cargo.toml, so the claim and the gate can't drift.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - run: cargo +${{ steps.msrv.outputs.v }} build --locked --all-features

  # The tests ship in the crate. Run them from the package, as a distro
  # packager would, so a test that needs a file the package leaves out fails here.
  packaged:
    name: tests from the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked --no-verify
      - name: Test the unpacked crate
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p "$RUNNER_TEMP/crate"
          tar -xzf "target/package/faf-$V.crate" -C "$RUNNER_TEMP/crate"
          cd "$RUNNER_TEMP/crate/faf-$V"
          cargo test --all-features
